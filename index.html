<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #141414);
    --hint: var(--tg-theme-hint-color, #97999b);
    --link: var(--tg-theme-link-color, #e0518f);
    --button: var(--tg-theme-button-color, #e0518f);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #eef0f2);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 16px 28px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
  }

  /* -- шапка: значок + хлебная крошка «Календарь › Месяц Год» -- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text); min-width: 0; }
  .crumb .icon { font-size: 16px; opacity: 0.7; flex-shrink: 0; }
  .crumb .sep { color: var(--hint); }
  .crumb .month { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav { display: flex; gap: 2px; flex-shrink: 0; }
  .nav-btn {
    background: none; border: none; color: var(--hint); font-size: 20px; line-height: 1;
    padding: 6px 9px; cursor: pointer; border-radius: 8px;
  }
  .nav-btn:active { background: var(--secondary-bg); color: var(--text); }

  /* -- маленький ряд инструментов, как «+» в референсе -- */
  .toolbar { display: flex; gap: 4px; margin: 6px 0 16px; }
  .icon-btn {
    background: none; border: none; color: var(--hint); font-size: 20px; width: 32px; height: 32px;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--secondary-bg); }

  /* -- карточка дня: светлый блок сверху, как левая панель в референсе -- */
  .detail-card { background: var(--secondary-bg); border-radius: 16px; padding: 18px 18px 16px; margin-bottom: 18px; }
  .detail-weekday { font-size: 15px; color: var(--hint); font-weight: 500; text-transform: capitalize; }
  .detail-day { font-size: 28px; font-weight: 800; margin-top: 1px; letter-spacing: -0.4px; text-transform: capitalize; }

  .event-row { display: flex; gap: 14px; padding: 11px 0; }
  .event-row + .event-row { border-top: 1px solid rgba(127,127,127,0.14); }
  .event-time { width: 44px; flex-shrink: 0; color: var(--hint); font-size: 13px; font-weight: 600; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .event-body { flex: 1; min-width: 0; }
  .event-title { font-size: 15px; font-weight: 500; }
  .event-place { color: var(--hint); font-weight: 400; }
  .event-meta { font-size: 11.5px; color: var(--link); margin-top: 2px; }
  .empty-hint { color: var(--hint); font-size: 13px; padding: 4px 0 2px; }

  /* -- форма добавления: скрыта, пока не нажали «+» -- */
  #add-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(127,127,127,0.18); display: flex; flex-direction: column; gap: 9px; }
  .scope-toggle { display: flex; gap: 8px; }
  .scope-btn {
    flex: 1; padding: 9px; border-radius: 10px; border: 1.5px solid rgba(127,127,127,0.25);
    background: transparent; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .scope-btn.active { background: var(--link); border-color: var(--link); color: var(--button-text); }
  input {
    padding: 10px 12px; border-radius: 10px; border: none;
    background: var(--bg); color: var(--text); font-size: 14px; width: 100%;
  }
  input::placeholder { color: var(--hint); }
  button.submit {
    padding: 11px; border-radius: 10px; border: none; background: var(--button); color: var(--button-text);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* -- сетка месяца: без рамок и заливки ячеек, крупные цифры -- */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 8px; }
  .weekdays span { text-align: center; font-size: 12.5px; color: var(--hint); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 16px; }
  .day {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    cursor: pointer; padding: 2px 0; min-height: 46px;
  }
  .day.outside { cursor: default; }
  .day .num { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1.15; }
  .day.outside .num { color: var(--hint); opacity: 0.55; font-weight: 600; }
  .day.today .num, .day.selected .num { color: var(--link); }
  .day .count { font-size: 13px; color: var(--link); opacity: 0.55; font-weight: 600; margin-top: 2px; }
  .day.selected .count { opacity: 1; }
  .day .count.has-shared { opacity: 0.85; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="crumb">
      <span class="icon">📅</span>
      <span>Календарь</span>
      <span class="sep">›</span>
      <span class="month" id="title"></span>
    </div>
    <div class="nav">
      <button class="nav-btn" id="prev" aria-label="Предыдущий месяц">‹</button>
      <button class="nav-btn" id="next" aria-label="Следующий месяц">›</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="icon-btn" id="add-toggle" aria-label="Добавить событие">+</button>
  </div>

  <div class="detail-card">
    <div class="detail-weekday" id="panel-weekday"></div>
    <div class="detail-day" id="panel-day"></div>
    <div id="panel-events"></div>
    <div id="add-section" hidden>
      <div class="scope-toggle">
        <button type="button" class="scope-btn active" data-shared="0">👤 Личное</button>
        <button type="button" class="scope-btn" data-shared="1">👨‍👩‍👧 Общее</button>
      </div>
      <form id="add-form">
        <input type="text" id="f-title" placeholder="Что за событие?" required maxlength="200">
        <input type="time" id="f-time">
        <input type="text" id="f-place" placeholder="Место (необязательно)" maxlength="300">
        <button type="submit" class="submit">Добавить</button>
      </form>
    </div>
  </div>

  <div class="weekdays" id="dow-row"></div>
  <div class="grid" id="grid"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WEEKDAY_FULL = ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];

function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return atob(s);
}

function parseData() {
  const params = new URLSearchParams(location.search);
  const raw = params.get('d');
  if (!raw) return {};
  try {
    return JSON.parse(decodeURIComponent(escape(b64urlDecode(raw))));
  } catch (e) {
    return {};
  }
}

// events: { "2026-09-14": [{title, time, place, kind, shared, owner}], ... }
const events = parseData();

let current = new Date();
current.setDate(1);
let selectedKey = null;
let sharedChoice = 0;

function dayKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderGrid() {
  const y = current.getFullYear(), m = current.getMonth();
  document.getElementById('title').textContent = `${MONTHS[m]} ${y}`;
  document.getElementById('dow-row').innerHTML = DOW.map(d => `<span>${d}</span>`).join('');

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7; // понедельник = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const now = new Date();
  const todayKey = dayKey(now.getFullYear(), now.getMonth(), now.getDate());

  const cells = [];
  for (let i = firstDow; i > 0; i--) {
    cells.push({ num: daysInPrevMonth - i + 1, outside: true });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ num: d, outside: false, key: dayKey(y, m, d) });
  }
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ num: nextDay++, outside: true });
  }

  for (const cell of cells) {
    if (cell.outside) {
      grid.insertAdjacentHTML('beforeend', `<div class="day outside"><span class="num">${cell.num}</span></div>`);
      continue;
    }
    const dayEvents = events[cell.key] || [];
    const cls = ['day'];
    if (cell.key === todayKey) cls.push('today');
    if (cell.key === selectedKey) cls.push('selected');
    const hasShared = dayEvents.some(e => e.shared);
    let countHtml = '';
    if (cell.key === selectedKey && dayEvents.length) {
      countHtml = `<span class="count">${dayEvents.length} ${plural(dayEvents.length)}</span>`;
    } else if (dayEvents.length) {
      countHtml = `<span class="count${hasShared ? ' has-shared' : ''}">${dayEvents.length}</span>`;
    }
    grid.insertAdjacentHTML(
      'beforeend',
      `<div class="${cls.join(' ')}" data-key="${cell.key}">
         <span class="num">${cell.num}</span>
         ${countHtml}
       </div>`
    );
  }

  grid.querySelectorAll('.day:not(.outside)').forEach(el => {
    el.addEventListener('click', () => openDay(el.dataset.key));
  });
}

function plural(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'событие';
  if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'события';
  return 'событий';
}

function openDay(k) {
  selectedKey = k;
  document.getElementById('add-form').dataset.key = k;
  const [y, m, d] = k.split('-').map(Number);
  const weekday = WEEKDAY_FULL[(new Date(y, m - 1, d).getDay() + 6) % 7];
  document.getElementById('panel-weekday').textContent = weekday;
  document.getElementById('panel-day').textContent = `${d} ${MONTHS_GEN[m - 1]}`;

  const list = document.getElementById('panel-events');
  const dayEvents = (events[k] || []).slice().sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  list.innerHTML = dayEvents.length
    ? dayEvents.map(e => {
        const icon = e.kind === 'date' ? '🎂 ' : '';
        const scope = e.shared ? '👨‍👩‍👧 Общее' : '';
        const owner = e.owner ? `${e.shared ? ' · ' : ''}от ${escapeHtml(e.owner)}` : '';
        const meta = scope || owner ? `<div class="event-meta">${scope}${owner}</div>` : '';
        const place = e.place ? ` <span class="event-place">· ${escapeHtml(e.place)}</span>` : '';
        return `
          <div class="event-row">
            <div class="event-time">${e.time || ''}</div>
            <div class="event-body">
              <div class="event-title">${icon}${escapeHtml(e.title)}${place}</div>
              ${meta}
            </div>
          </div>`;
      }).join('')
    : '<div class="empty-hint">Пока ничего не запланировано</div>';

  document.getElementById('add-section').hidden = true;
  document.getElementById('f-title').value = '';
  document.getElementById('f-time').value = '';
  document.getElementById('f-place').value = '';
  setScope(0);

  renderGrid();
}

function setScope(shared) {
  sharedChoice = shared;
  document.querySelectorAll('.scope-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.shared) === shared);
  });
}

document.querySelectorAll('.scope-btn').forEach(btn => {
  btn.addEventListener('click', () => setScope(Number(btn.dataset.shared)));
});

document.getElementById('add-toggle').addEventListener('click', () => {
  const section = document.getElementById('add-section');
  section.hidden = !section.hidden;
  if (!section.hidden) document.getElementById('f-title').focus();
});

document.getElementById('prev').addEventListener('click', () => { current.setMonth(current.getMonth() - 1); renderGrid(); });
document.getElementById('next').addEventListener('click', () => { current.setMonth(current.getMonth() + 1); renderGrid(); });

document.getElementById('add-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const k = e.target.dataset.key;
  const title = document.getElementById('f-title').value.trim();
  const time = document.getElementById('f-time').value || null;
  const place = document.getElementById('f-place').value.trim() || null;
  if (!title) return;
  const payload = { date: k, title, time, place, shared: sharedChoice };
  if (tg && tg.sendData) {
    tg.sendData(JSON.stringify(payload));
  } else {
    alert('Открыто вне Telegram — добавление недоступно.');
  }
});

// открываем сегодняшний день сразу, чтобы карточка сверху не пустовала
const now = new Date();
openDay(dayKey(now.getFullYear(), now.getMonth(), now.getDate()));
</script>
</body>
</html>
